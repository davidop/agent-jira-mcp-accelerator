name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test Jira.Client
        run: dotnet test tests/Jira.Client.Tests/Jira.Client.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=ci-jira-client" --collect:"XPlat Code Coverage"

      - name: Test Agent.Api
        run: dotnet test tests/Agent.Api.Tests/Agent.Api.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=ci-agent-api" --collect:"XPlat Code Coverage"

      - name: Test Jira.McpServer
        run: dotnet test tests/Jira.McpServer.Tests/Jira.McpServer.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=ci-mcp-server" --collect:"XPlat Code Coverage"

      - name: Build Web.E2E
        run: dotnet build tests/Web.E2E/Web.E2E.csproj -c Release --no-restore

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          if (-not (Test-Path "tests/Web.E2E/bin/Release/net10.0/playwright.ps1")) {
            Write-Error "Playwright install script not found. Build Web.E2E before browser bootstrap."
          }
          pwsh tests/Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Smoke tests (Mock mode) - attempt 1
        id: smoke_attempt_1
        continue-on-error: true
        timeout-minutes: 12
        env:
          Jira__Mode: Mock
        run: dotnet test tests/Web.E2E/Web.E2E.csproj -c Release --no-build --logger "trx;LogFilePrefix=ci-web-smoke-1" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName~Smoke"

      - name: Smoke tests (Mock mode) - retry 1
        id: smoke_attempt_2
        if: steps.smoke_attempt_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 12
        env:
          Jira__Mode: Mock
        run: dotnet test tests/Web.E2E/Web.E2E.csproj -c Release --no-build --logger "trx;LogFilePrefix=ci-web-smoke-2" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName~Smoke"

      - name: Enforce smoke gate
        if: always()
        shell: pwsh
        run: |
          $first = "${{ steps.smoke_attempt_1.outcome }}"
          $second = "${{ steps.smoke_attempt_2.outcome }}"

          if ($first -eq 'success' -or $second -eq 'success') {
            Write-Host "Smoke gate passed."
            exit 0
          }

          Write-Error "Smoke gate failed in Mock mode. This blocks merge readiness."

      - name: Mermaid freshness warning (non-blocking)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.sha }}"
          $changed = git diff --name-only $base $head

          $testImpact = $changed | Where-Object { $_ -match '^(src/|tests/|\.github/workflows/ci\.yml)' }
          $docsUpdated = $changed | Where-Object { $_ -match '^docs/testing/' }

          if ($testImpact -and -not $docsUpdated) {
            Write-Host "::warning title=Mermaid freshness::Test-impacting changes detected without docs/testing updates. Diagram freshness is non-blocking in this phase."
          }
          else {
            Write-Host "::notice title=Mermaid freshness::No freshness warning for docs/testing."
          }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
            tests/Web.E2E/test-results/**
            tests/Web.E2E/playwright-report/**
