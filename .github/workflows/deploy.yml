name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_ENV_NAME: pocmvcjira
  AZURE_LOCATION: westeurope
  AZURE_RESOURCE_GROUP: POCMVCJIRA

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Authenticate azd
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --client-secret "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --no-prompt

      - name: azd provision (preview)
        working-directory: infra
        run: |
          azd env new $AZURE_ENV_NAME --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --location $AZURE_LOCATION --no-prompt 2>/dev/null || \
          azd env select $AZURE_ENV_NAME --no-prompt
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd env set AZURE_RESOURCE_GROUP $AZURE_RESOURCE_GROUP
          azd env set DEPLOY_APPS false
          azd provision --preview --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: azd provision
        working-directory: infra
        run: azd provision --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Ensure deployApps is disabled for base infra stage
        working-directory: infra
        run: |
          azd env select $AZURE_ENV_NAME --no-prompt
          azd env set DEPLOY_APPS false

      - name: Verify provisioned Azure resources
        run: |
          set -euo pipefail

          az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type "Microsoft.Insights/components" \
            --name "ent-agent-accel-appi" >/dev/null

          az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type "Microsoft.KeyVault/vaults" \
            --name "ent-agent-accel-kv" >/dev/null

          az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type "Microsoft.ContainerRegistry/registries" \
            --name "entagentaccelacr" >/dev/null

          az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type "Microsoft.Storage/storageAccounts" \
            --name "entagentaccelst" >/dev/null

          echo "Verified existing Azure resources in resource group: $AZURE_RESOURCE_GROUP"

      - name: Publish service images to ACR
        run: |
          set -euo pipefail

          ACR_NAME="entagentaccelacr"
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)

          az acr login --name "$ACR_NAME"

          dotnet publish src/Agent.Api/Agent.Api.csproj \
            -c Release \
            /t:PublishContainer \
            -p:EnableSdkContainerSupport=true \
            -p:ContainerRegistry="$ACR_LOGIN_SERVER" \
            -p:ContainerRepository="agent-api" \
            -p:ContainerImageTag="${GITHUB_SHA}"

          dotnet publish src/Jira.McpServer/Jira.McpServer.csproj \
            -c Release \
            /t:PublishContainer \
            -p:EnableSdkContainerSupport=true \
            -p:ContainerRegistry="$ACR_LOGIN_SERVER" \
            -p:ContainerRepository="jira-mcp-server" \
            -p:ContainerImageTag="${GITHUB_SHA}"

          dotnet publish src/Web/Web.csproj \
            -c Release \
            /t:PublishContainer \
            -p:EnableSdkContainerSupport=true \
            -p:ContainerRegistry="$ACR_LOGIN_SERVER" \
            -p:ContainerRepository="web" \
            -p:ContainerImageTag="${GITHUB_SHA}"

      - name: Verify ACR repositories contain published tags
        run: |
          set -euo pipefail

          ACR_NAME="entagentaccelacr"

          for repo in agent-api jira-mcp-server web; do
            echo "Checking tags for repository: $repo"
            tags=$(az acr repository show-tags --name "$ACR_NAME" --repository "$repo" --top 5 -o tsv)

            if [ -z "$tags" ]; then
              echo "No tags found in $repo"
              exit 1
            fi

            echo "$tags"
          done

      - name: Runtime deploy what-if (Container Apps)
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              name="ent-agent-accel" \
              deployApps=true \
              imageTag="${GITHUB_SHA}"

      - name: Runtime deploy (Container Apps)
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "runtime-${GITHUB_RUN_ID}" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              name="ent-agent-accel" \
              deployApps=true \
              imageTag="${GITHUB_SHA}"

      - name: Verify runtime URLs
        run: |
          set -euo pipefail

          AGENT_API_FQDN=$(az containerapp show --name ent-agent-accel-api --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          MCP_FQDN=$(az containerapp show --name ent-agent-accel-mcp --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          WEB_FQDN=$(az containerapp show --name ent-agent-accel-web --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)

          if [ -z "$AGENT_API_FQDN" ] || [ -z "$MCP_FQDN" ] || [ -z "$WEB_FQDN" ]; then
            echo "One or more Container Apps URLs are empty"
            exit 1
          fi

          echo "Agent API URL: https://$AGENT_API_FQDN"
          echo "Jira MCP URL: https://$MCP_FQDN"
          echo "Web URL: https://$WEB_FQDN"
