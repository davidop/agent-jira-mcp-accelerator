name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_ENV_NAME: pocmvcjira
  AZURE_LOCATION: westeurope
  AZURE_RESOURCE_GROUP: POCMVCJIRA

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: azd provision (preview)
        run: |
          azd env new $AZURE_ENV_NAME --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --location $AZURE_LOCATION --no-prompt 2>/dev/null || \
          azd env select $AZURE_ENV_NAME --no-prompt
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd env set AZURE_RESOURCE_GROUP $AZURE_RESOURCE_GROUP
          azd provision --preview --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: azd provision
        run: azd provision --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
